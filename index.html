<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DitherFile</title>
        <link rel="stylesheet" href="./src/style.css" />
    </head>
    <body class="bg-ApplyDark">
        <!-- Canvas for the 3D Space -->
        <div class="z-2 relative w-[70vw] 2xl:w-[80vw] h-screen overflow-clip">
            <!-- ESSENTIAL: 3D Canvas -->
            <div
                class="cus-bgColour absolute inset-[0.4vw] flex justify-center items-center bg-ApplyOrange rounded-2xl overflow-clip"
            >
                <canvas id="canvas"></canvas>
                <canvas
                    class="opacity-0 absolute w-[68.2vw] 2xl:w-[78.2vw] h-full inset-[0.4vw] pointer-events-none"
                    id="imgLoadCanvas"
                ></canvas>
            </div>
        </div>

        <!-- OPTIONAL: Page Decoration -->
        <img
            class="cus-pageDeco absolute -top-20 -left-20 w-32 z-1 rotate-225 -scale-y-100"
            src="src/assets/LogoMarkShape1.svg"
        />
        <img
            class="cus-pageDeco absolute -bottom-20 -left-20 w-32 z-1 rotate-135"
            src="src/assets/LogoMarkShape1.svg"
        />
        <img
            class="cus-pageDeco absolute -right-20 -top-20 w-32 z-1 rotate-315"
            src="src/assets/LogoMarkShape1.svg"
        />
        <img
            class="cus-pageDeco absolute -right-20 -bottom-20 w-32 z-1 rotate-45 -scale-y-100"
            src="src/assets/LogoMarkShape1.svg"
        />

        <!-- Control Box -->
        <div
            class="z-2 absolute right-[0.4vw] top-[0.4vw] bottom-[0.4vw] w-[29.6vw] 2xl:w-[19.6vw] ml-[0.4vw] bg-ApplyWhite rounded-2xl overflow-hidden shadow-sm"
        >
            <div
                class="slider-container w-full h-full flex flex-col p-8 text-xs gap-[2vh] font-AlbraLight overflow-y-auto scrollbar-none"
            >
                <!-- Intro -->
                <img src="src/assets/LogoApplyAI.svg" class="px-8 pb-4" />
                <h1 class="text-base text-center">
                    Click and drag in the orange space to pan around the object.
                    Upload a png that has a clear subject with good contrast and
                    a transparent background.
                </h1>

                <!-- Image and Mode Choice -->
                <div class="flex-row flex mt-6 gap-4 ml-1">
                    <label
                        for="pickImage"
                        class="group w-20 place-items-center place-content-center cursor-default"
                    >
                        <i
                            data-lucide="image-up"
                            class="transition-all duration-100 ease-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8 cursor-pointer"
                        ></i>

                        <input
                            type="file"
                            id="pickImage"
                            accept="image/*"
                            class="hidden"
                        />
                    </label>

                    <div
                        id="modeSelect"
                        class="relative group w-full flex flex-row h-10 place-items-center rounded-4xl outline-1 outline-ApplyDark"
                    >
                        <i
                            data-lucide="chevron-down"
                            class="absolute left-4 transition-all duration-100 ease-out group-hover:scale-125 group-hover:text-ApplyOrange pointer-events-none z-10"
                        ></i>

                        <select
                            id="modeSelection"
                            class="appearance-none w-full h-full text-center bg-transparent cursor-pointer font-AlbraSans text-sm select-none outline-none pl-12 pr-4 leading-10.5 transition-all duration-100 ease-out hover:text-ApplyOrange hover:scale-105"
                        >
                            <option value="" disabled selected hidden>
                                Mode Selection
                            </option>

                            <option value="3DMode">3D Mode (Default)</option>
                            <option value="PatternGenerator ">
                                Pattern Generator (OFFLINE)
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Animation Presets -->
                <div
                    class="flex flex-row justify-center items-center text-applyDark cursor-default my-6"
                >
                    <div
                        id="focusCamera"
                        class="group w-20 place-items-center place-content-center cursor-default"
                    >
                        <i
                            data-lucide="focus"
                            class="transition-all duration-100 ease-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8 cursor-pointer"
                        ></i>
                    </div>
                    <div class="border border-b-ApplyDark h-10 mr-6"></div>

                    <div
                        id="rotationAnimation"
                        class="group w-20 place-items-center place-content-center cursor-pointer"
                    >
                        <i
                            data-lucide="snail"
                            class="transition-all duration-300 ease-in-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8"
                        ></i>
                    </div>

                    <div
                        id="spinAnimation"
                        class="group w-20 place-items-center place-content-center cursor-pointer"
                    >
                        <i
                            data-lucide="circle-gauge"
                            class="transition-all duration-300 ease-in-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8"
                        ></i>
                    </div>

                    <div
                        id="bounceAnimation"
                        class="group w-20 place-items-center place-content-center cursor-pointer"
                    >
                        <i
                            data-lucide="zoom-in"
                            class="transition-all duration-300 ease-in-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8"
                        ></i>
                    </div>
                </div>

                <!-- Slider Controls -->
                <div class="flex flex-col gap-4">
                    <label
                        for="pixelAmount"
                        class="flex flex-col text-center justify-between font-medium text-black uppercase leading-8 tracking-wider select-none"
                    >
                        <span class="font-AlbraLight text-lg">Dot Amount</span>
                        <span class="font-AlbraMedium"
                            >The amount of dots in the object</span
                        >
                    </label>
                    <input
                        type="range"
                        id="pixelAmount"
                        min="0"
                        max="100"
                        value="100"
                        step="1"
                        class="appearance-none cursor- accent-ApplyOrange bg-ApplyDark h-[0.08vh] w-[75%] mx-auto"
                    />
                </div>
                <div class="flex flex-col gap-4">
                    <label
                        for="pixelScale"
                        class="flex flex-col text-center justify-between font-medium text-black uppercase leading-8 tracking-wider select-none"
                    >
                        <span class="font-AlbraLight text-xl">Dot Scale</span>
                        <span class="font-AlbraMedium"
                            >The size for the individual dots</span
                        >
                    </label>
                    <input
                        type="range"
                        id="pixelScale"
                        min="0"
                        max="100"
                        value="10"
                        step="1"
                        class="appearance-none cursor- accent-ApplyOrange bg-ApplyDark h-[0.08vh] w-[75%] mx-auto"
                    />
                </div>
                <!--<div class="flex flex-col gap-4">
                    <label
                        for="gridScale"
                        class="flex flex-col text-center justify-between font-medium text-black uppercase leading-8 tracking-wider select-none"
                    >
                        <span class="font-AlbraLight text-xl"> Grid Scale</span>
                        <span class="font-AlbraMedium"
                            >Increase the spacing on the Z-axis</span
                        >
                    </label>
                    <input
                        type="range"
                        id="gridScale"
                        min="0"
                        max="100"
                        value="50"
                        step="1"
                        class="appearance-none cursor- accent-ApplyOrange bg-ApplyDark h-[0.08vh] w-[75%] mx-auto"
                    />
                </div>-->

                <!-- Reenable to turn on the slider for pixel distortion-->
                <!--<div class="flex flex-col gap-4">
                <label
                    for="pixelDistortion"
                    class="flex flex-col text-center justify-between font-medium text-black uppercase leading-8 tracking-wider select-none"
                >
                    <span class="font-AlbraLight text-xl">Pixel Chaos</span>
                    <span class="font-AlbraMedium"
                        >Perfect circle to irregular pen dot</span
                    >
                </label>
                <input
                    type="range"
                    id="pixelDistortion"
                    min="0"
                    max="100"
                    value="50"
                    step="1"
                    class="appearance-none cursor- accent-ApplyOrange bg-ApplyDark h-[0.08vh] w-[75%] mx-auto"
                />
            </div>-->

                <!--<div class="flex flex-col gap-4">
                    <label
                        for="clipDepth"
                        class="flex flex-col text-center justify-between font-medium text-black uppercase leading-8 tracking-wider select-none"
                    >
                        <span class="font-AlbraLight text-xl">Depth Slice</span>
                        <span class="font-AlbraMedium"
                            >Amount of dots that disappear</span
                        >
                    </label>
                    <input
                        type="range"
                        id="clipDepth"
                        min="0"
                        max="100"
                        value="100"
                        step="1"
                        class="appearance-none cursor-pointer accent-ApplyOrange bg-ApplyDark h-[0.08vh] w-[75%] mx-auto"
                    />
                </div>-->

                <div class="flex flex-col gap-4">
                    <label
                        for="scaleRatio"
                        class="flex flex-col text-center justify-between font-medium text-black uppercase leading-8 tracking-wider select-none"
                    >
                        <span class="font-AlbraLight text-xl"
                            >Dot Difference</span
                        >
                        <span class="font-AlbraMedium"
                            >Size of biggest vs smallest dot</span
                        >
                    </label>
                    <input
                        type="range"
                        id="scaleRatio"
                        min="0"
                        max="100"
                        value="20"
                        step="1"
                        class="appearance-none cursor-pointer accent-ApplyOrange bg-ApplyDark h-[0.08vh] w-[75%] mx-auto"
                    />
                </div>

                <div class="flex flex-col gap-4">
                    <label
                        for="pixelGravity"
                        class="flex flex-col text-center justify-between font-medium text-black uppercase leading-8 tracking-wider select-none"
                    >
                        <span class="font-AlbraLight text-xl"
                            >Gravitational Pull</span
                        >
                        <span class="font-AlbraMedium">
                            Gravitational pull on the dots</span
                        >
                    </label>
                    <input
                        type="range"
                        id="pixelGravity"
                        min="0"
                        max="100"
                        value="100"
                        step="1"
                        class="appearance-none cursor- accent-ApplyOrange bg-ApplyDark h-[0.08vh] w-[75%] mx-auto"
                    />
                </div>

                <!-- Design Dropdowns -->
                <div
                    class="flex flex-row justify-center items-center text-applyDark cursor-default mt-8 gap-4"
                >
                    <div
                        class="relative group w-full flex flex-row h-10 place-items-center rounded-4xl outline-1 outline-ApplyDark"
                    >
                        <i
                            data-lucide="chevron-down"
                            class="absolute left-4 transition-all duration-100 ease-out group-hover:scale-125 group-hover:text-ApplyOrange pointer-events-none z-10"
                        ></i>

                        <select
                            id="pixelShape"
                            class="appearance-none w-full h-full text-center bg-transparent cursor-pointer font-AlbraSans text-sm select-none outline-none pl-12 pr-4 leading-10.5 transition-all duration-100 ease-out hover:text-ApplyOrange hover:scale-105"
                        >
                            <option value="" disabled selected hidden>
                                Shape
                            </option>

                            <option value="icosahedron">
                                Pen Dot (Default)
                            </option>
                            <option value="box">Cube</option>
                            <option value="sphere">Sphere</option>
                            <option value="torus">Torus</option>
                        </select>
                    </div>
                    <div
                        class="relative group w-full flex flex-row h-10 place-items-center rounded-4xl outline-1 outline-ApplyDark"
                    >
                        <i
                            data-lucide="chevron-down"
                            class="absolute left-4 transition-all duration-100 ease-out group-hover:scale-125 group-hover:text-ApplyOrange pointer-events-none z-10"
                        ></i>

                        <select
                            id="cus-bgChoice"
                            class="appearance-none w-full h-full text-center bg-transparent cursor-pointer font-AlbraSans text-sm select-none outline-none pl-12 pr-4 leading-10.5 transition-all duration-100 ease-out hover:text-ApplyOrange hover:scale-105"
                        >
                            <option
                                value="ColourOrange"
                                disabled
                                selected
                                hidden
                            >
                                Backdrop
                            </option>

                            <option value="ColourOrange">
                                Orange (Default)
                            </option>
                            <option value="ColourBlack">Black</option>
                            <option value="ColourWhite">White</option>
                            <option value="ColourMaroon">Maroon</option>
                        </select>
                    </div>
                </div>
                <div
                    class="flex flex-row justify-center items-center text-applyDark cursor-default mt-2 relative"
                >
                    <div
                        id="exportSpinner"
                        class="export-spinner-container hidden"
                    >
                        <img
                            src="./assets/LogoMarkFull.svg"
                            class="w-6 h-6 export-logo-spin"
                            alt="Loading Logo"
                        />
                    </div>
                    <div
                        class="group w-20 h-20 place-items-center place-content-center"
                    >
                        <i data-lucide="file-down" class="w-8 h-8"></i>
                    </div>

                    <div class="border border-b-ApplyDark h-10 mr-6"></div>

                    <a
                        id="export3D"
                        class="group w-20 h-20 place-items-center place-content-center cursor-pointer"
                    >
                        <i
                            data-lucide="box"
                            class="transition-all duration-300 ease-in-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8"
                        ></i>
                    </a>

                    <div
                        id="exportPhoto"
                        class="group w-20 h-20 place-items-center place-content-center cursor-pointer"
                    >
                        <i
                            data-lucide="camera"
                            class="transition-all duration-300 ease-in-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8"
                        ></i>
                    </div>

                    <a
                        id="exportVideo"
                        class="group w-20 h-20 place-items-center place-content-center cursor-pointer"
                    >
                        <i
                            data-lucide="video"
                            class="transition-all duration-300 ease-in-out group-hover:scale-125 group-hover:text-ApplyOrange w-8 h-8"
                        ></i>
                    </a>
                </div>
            </div>

            <div
                id="scrollIndicator"
                class="absolute bottom-0 left-0 right-0 h-24 bg-linear-to-t from-ApplyWhite via-ApplyWhite/90 to-transparent pointer-events-none flex items-end justify-center pb-4 transition-opacity duration-300 opacity-0"
            >
                <i
                    data-lucide="chevron-down"
                    class="w-6 h-6 text-ApplyDark animate-bounce"
                ></i>
            </div>
        </div>
        <!-- Default Image -->
        <img
            id="defaultImage"
            class="hidden"
            src="src/assets/defaultImageTransparent.png"
        />

        <!-- Javascript Code Call -->
        <script type="module" src="src/main.js"></script>
    </body>
</html>
