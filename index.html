<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DitherFile</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <!-- Canvas for the 3D Space -->
        <div class="flex h-screen justify-center items-center">
            <canvas id="canvas"></canvas>
        </div>

        <!-- Labels and Slider Controls -->
        <div
            class="slider-container absolute bottom-30 flex w-screen justify-around"
        >
            <div
                class="text-xs text-center py-2 px-8 font-medium rounded-2xl bg-white text-black uppercase tracking-wider select-none"
            >
                <h1>
                    Click and drag to move around. Works best with a png that
                    has a clear subject with good contrast and a transparent
                    background. Not sure about mobile yet
                </h1>
            </div>
        </div>

        <div
            class="slider-container absolute bottom-10 flex w-screen justify-around"
        >
            <label
                for="imageLoader"
                class="w-[12vw] h-[4vh] bg-white flex flex-col justify-center items-center rounded-xl cursor-pointer"
            >
                <span
                    class="text-xs flex justify-between font-medium text-black uppercase tracking-wider select-none"
                    >Upload Image</span
                >
                <input
                    type="file"
                    id="imageLoader"
                    accept="image/*"
                    class="hidden"
                />
            </label>
            <label
                id="resetCamera"
                class="w-[12vw] h-[4vh] bg-white flex flex-col justify-center items-center rounded-xl cursor-pointer"
            >
                <span
                    class="text-xs flex justify-between font-medium text-black uppercase tracking-wider select-none"
                    >Reset Camera</span
                >
            </label>
            <label
                id="pauseRotation"
                class="w-[12vw] h-[4vh] bg-white flex flex-col justify-center items-center rounded-xl cursor-pointer"
            >
                <a
                    class="text-xs flex justify-between font-medium text-black uppercase tracking-wider select-none"
                    >Pause/Play Rotation</a
                >
            </label>
            <div
                class="w-[12vw] h-[4vh] bg-white flex flex-col justify-center items-center rounded-xl"
            >
                <label
                    for="gridScale"
                    class="text-xs flex justify-between font-medium text-black uppercase tracking-wider h-6 select-none"
                >
                    <span>Pixel Amount</span>
                </label>
                <input
                    type="range"
                    id="gridScale"
                    min="0"
                    max="100"
                    value="50"
                    step="1"
                    class="w-[10vw] h-1 rounded-lg appearance-none cursor-pointer accent-blue-500 bg-black"
                />
            </div>
            <div
                class="w-[12vw] h-[4vh] bg-white flex flex-col justify-center items-center rounded-xl"
            >
                <label
                    for="sizeScale"
                    class="text-xs flex justify-between font-medium text-black uppercase tracking-wider h-6 select-none"
                >
                    <span>Pixel Scale</span>
                </label>
                <input
                    type="range"
                    id="sizeScale"
                    min="0"
                    max="100"
                    value="80"
                    step="1"
                    class="w-[10vw] h-1 rounded-lg appearance-none cursor-pointer accent-blue-500 bg-black"
                />
            </div>
            <div
                class="w-[12vw] h-[4vh] bg-white flex flex-col justify-center items-center rounded-xl"
            >
                <label
                    for="spaceScale"
                    class="text-xs flex justify-between font-medium text-black uppercase tracking-wider h-6 select-none"
                >
                    <span>Grid Scale</span>
                </label>
                <input
                    type="range"
                    id="spaceScale"
                    min="0"
                    max="100"
                    value="50"
                    step="1"
                    class="w-[10vw] h-1 rounded-lg appearance-none cursor-pointer accent-blue-500 bg-black"
                />
            </div>
            <div
                class="w-[12vw] h-[4vh] bg-white flex flex-col justify-center items-center rounded-xl"
            >
                <label
                    for="noiseScale"
                    class="text-xs flex justify-between font-medium text-black uppercase tracking-wider h-6 select-none"
                >
                    <span>Chaos Level</span>
                </label>
                <input
                    type="range"
                    id="noiseScale"
                    min="0"
                    max="100"
                    value="50"
                    step="1"
                    class="w-[10vw] h-1 rounded-lg appearance-none cursor-pointer accent-blue-500 bg-black"
                />
            </div>
        </div>

        <!-- Default Image -->
        <img
            id="defaultImage"
            class="hidden"
            src="src/assets/defaultImageTransparent.png"
        />

        <!-- Javascript Code Call -->
        <script type="module" src="src/main.js"></script>
    </body>
</html>
