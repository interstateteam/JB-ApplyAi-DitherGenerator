<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DitherFile</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <label
            for="imageLoader"
            class="flex absolute top-5 left-5 bg-white text-black w-60 h-20 justify-center items-center rounded-2xl cursor-pointer hover:bg-gray-800 hover:text-white transition-colors select-none"
        >
            <span class="text-2xl font-medium">Upload Image</span>
            <input
                type="file"
                id="imageLoader"
                accept="image/*"
                class="hidden"
            />
        </label>

        <div class="flex h-screen justify-center items-center">
            <canvas id="canvas"></canvas>
        </div>

        <img
            id="defaultImage"
            class="hidden"
            src="src/assets/defaultImage.webp"
        />

        <script src="src/imageLogic.js"></script>
        <!--<script type="module" src="src/main.js"></script>-->
    </body>
</html>
