<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Three.js Pixel Grid</title>
        <style>
            body {
                margin: 0;
                background-color: #050505;
                font-family: sans-serif;
                color: white;
                overflow: hidden;
            }
            #ui {
                position: absolute;
                top: 20px;
                left: 20px;
                z-index: 10;
                background: rgba(0, 0, 0, 0.7);
                padding: 15px;
                border-radius: 8px;
            }
            #canvas3d {
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>
    <body>
        <div id="ui">
            <h3>Upload Image for 3D Grid</h3>
            <input type="file" id="imageLoader" accept="image/*" />
        </div>

        <div id="canvas3d"></div>

        <canvas id="processingCanvas" style="display: none"></canvas>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="src/testComp.js"></script>
    </body>
</html>
